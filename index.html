<title>Dr. Marc Lewis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a single centered link-list column (about 600px wide on desktop, full width on phones):
   headshot, name, one titled button per destination, social icons pinned to the bottom.
   This is a faithful single-look replica, so it stays light in every viewer theme.

   TO CUSTOMIZE: colors live in the tokens below; text, links and images live in the
   marked sections of the page markup. */
:root {
  --outer-bg: #cfcdd1;       /* area outside the column on wide screens */
  --page-bg: #fcfcfb;        /* the column itself */
  --accent: #ee362f;         /* name and button text */
  --button-bg: #0a0907;      /* button fill */
  --button-bg-hover: #221f1b;
  --heading: #000000;        /* the line above each button */
  --muted: #68676c;          /* subtitle, "Follow Me", social icons */
  --font: "Lato", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
body {
  background: var(--outer-bg);
  color: var(--heading);
  font-family: var(--font);
  margin: 0;
}
.page {
  box-sizing: border-box;
  max-width: 606px;
  min-height: 100svh;
  margin-inline: auto;
  padding-inline: 20px;
  padding-block: 30px 24px;
  background: var(--page-bg);
  display: flex;
  flex-direction: column;
}
.profile { text-align: center; display: flex; flex-direction: column; align-items: center; }
.photo {
  width: 128px; height: 128px; box-sizing: border-box;
  border-radius: 50%; object-fit: cover;
  border: 6px solid var(--page-bg);
  display: block;
}
.name { margin: 22px 0 0; font-size: 20px; line-height: 24px; font-weight: 700; color: var(--accent); }
.subtitle { margin: 2px 0 0; font-size: 12px; line-height: 20px; font-weight: 700; color: var(--muted); }
.links { margin-top: 28px; display: flex; flex-direction: column; gap: 26px; }
.group { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.group h2 { margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--heading); overflow-wrap: anywhere; }
.button {
  display: flex; align-items: center; gap: 16px;
  box-sizing: border-box; min-height: 66px; padding: 13px;
  background: var(--button-bg); color: var(--accent);
  border-radius: 4px; text-decoration: none;
  font-size: 14px; font-weight: 400;
}
.button:hover { background: var(--button-bg-hover); }
.button:focus-visible, .social a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.button img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; flex: none; display: block; }
.footer { margin-top: auto; padding-top: 48px; text-align: center; }
.footer h2 { margin: 0 0 9px; font-size: 15px; line-height: 20px; font-weight: 700; color: var(--muted); }
.social { display: flex; justify-content: center; gap: 8px; }
.social a { display: block; width: 40px; height: 40px; color: var(--muted); border-radius: 4px; }
.social svg { width: 40px; height: 40px; display: block; }
</style>
</head>
